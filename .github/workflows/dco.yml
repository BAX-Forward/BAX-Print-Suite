name: dco

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: dco
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check Signed-off-by trailers
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t commits < <(git rev-list "${{ github.event.pull_request.base.sha }}..HEAD")
          if [ "${#commits[@]}" -eq 0 ]; then
            echo "No commits found between ${{ github.event.pull_request.base.sha }} and HEAD."
            exit 1
          fi

          failed=0
          for sha in "${commits[@]}"; do
            author_email="$(git log -1 --format='%ae' "$sha")"
            subject="$(git log -1 --format='%s' "$sha")"
            ok=0
            while IFS= read -r trailer || [ -n "$trailer" ]; do
              case "$trailer" in
                "Signed-off-by:"*)
                  value="${trailer#"Signed-off-by:"}"
                  value="${value#"${value%%[![:space:]]*}"}"
                  signoff_email="$(printf '%s' "$value" | sed -n 's/^.*<\([^<>]*\)>[[:space:]]*$/\1/p')"
                  if [ -n "$signoff_email" ] && [ "$signoff_email" = "$author_email" ]; then
                    ok=1
                    break
                  fi
                  ;;
              esac
            done < <(git log -1 --format='%B' "$sha" | git interpret-trailers --parse)

            if [ "$ok" -eq 1 ]; then
              printf 'ok %s %s %s\n' "$sha" "$author_email" "$subject"
            else
              echo "::error title=DCO::${sha} (${author_email}) is missing a Signed-off-by trailer for that author email"
              printf 'fail %s %s %s\n' "$sha" "$author_email" "$subject"
              failed=1
            fi
          done

          exit "$failed"

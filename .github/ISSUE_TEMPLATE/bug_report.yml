name: Bug report
description: Something doesn't work as expected
labels: [bug, triage]
body:
  - type: textarea
    id: what
    attributes: {label: "What happened?", description: "Include expected vs. actual behavior."}
    validations: {required: true}
  - type: textarea
    id: repro
    attributes: {label: Steps to reproduce}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: Version / commit}
  - type: dropdown
    id: os
    attributes: {label: OS, options: [Windows, macOS, Linux, Other]}
  - type: textarea
    id: logs
    attributes: {label: Logs, render: shell}
  - type: checkboxes
    id: safe
    attributes:
      label: Confirmation
      options:
        - label: I have not attached confidential customer files, credentials, or NDA material.
          required: true
